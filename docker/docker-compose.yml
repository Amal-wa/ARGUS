services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: zt_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # --requirepass: proven live during this project's own security audit that
    # ANY container on internal_net could otherwise read/write any key with zero
    # credentials -- including forging mfa:verified:{user_id}:{jti} directly,
    # bypassing the entire step-up mechanism without ever touching the Gateway.
    # A shared password (not per-service ACLs -- see SECURITY.md for that
    # trade-off) closes the larger part of that: a container that never
    # compromised any of our services can no longer touch Redis at all. It does
    # NOT stop an already-compromised service (isolation-forest,
    # canary-validator, ml-trainer, behavioral-detector), which knows the same
    # shared password every legitimate service uses -- documented, not hidden.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass redis-dev-password
    environment:
      # Picked up automatically by the healthcheck's plain `redis-cli ping`
      # below (and by any `docker exec redis redis-cli ...` during manual
      # debugging) -- avoids `-a redis-dev-password` on the command line
      # itself, which would both print a "password on command line" warning to
      # stderr and show the password in `docker inspect`'s command list, not
      # just its environment.
      REDISCLI_AUTH: redis-dev-password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - internal_net

  vault:
    image: hashicorp/vault:1.20.2
    container_name: vault
    command: server -dev -dev-root-token-id=dev-root-token -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.20.2
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./vault-init.sh:/vault-init.sh:ro
      # The only writer: issues the CA + the two mTLS leaf certs (see
      # vault-init.sh) into this shared volume for opa/api-gateway to mount
      # read-only below.
      - mtls-certs:/certs
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    networks:
      - internal_net
    # This container runs once and exits 0 - it is not a long-running service.

  opa:
    image: openpolicyagent/opa:1.18.1
    container_name: opa
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
    command: >
      run
      --server
      --addr https://0.0.0.0:8181
      --tls-cert-file /certs/opa-server.pem
      --tls-private-key-file /certs/opa-server-key.pem
      --tls-ca-cert-file /certs/ca.pem
      --authentication=tls
      --min-tls-version 1.3
      /policy
    volumes:
      - ../policies:/policy:ro
      - mtls-certs:/certs:ro
    networks:
      - internal_net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # opa eval is a local CLI evaluation, not an HTTP call -- unaffected by
      # the https/mTLS switch above (verified: `opa run --help` shows
      # --authentication/--tls-* are server flags, this healthcheck never
      # touches the server at all).
      test: ["CMD", "opa", "eval", "--fail", "1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: zt-api
    ports:
      - "8000:8000"
    env_file:
      - ../services/api-gateway/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@postgres:5432/zt_db
      - REDIS_URL=redis://:redis-dev-password@redis:6379
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
      - OPA_URL=https://opa:8181
      # mTLS Gateway<->internal services: the Gateway's own client cert/key
      # (issued by vault-init.sh's gateway-client PKI role) and the internal
      # CA it uses to verify a peer's server cert. ONE identity, shared by
      # BOTH OPA and Isolation Forest below -- not OPA-specific despite the
      # historical name of this env var group, since the same CA signed both
      # peers' server certs from the one root generated in vault-init.sh
      # (see core/tls.py, main.py).
      - GATEWAY_CLIENT_CERT_PATH=/certs/gateway-client.pem
      - GATEWAY_CLIENT_KEY_PATH=/certs/gateway-client-key.pem
      - INTERNAL_CA_CERT_PATH=/certs/ca.pem
      # https:// -- Isolation Forest now requires mTLS too (isolation-forest
      # service block below), same as OPA. Reachability proven live BEFORE
      # this fix: an unauthenticated impersonator aliased "isolation-forest"
      # on internal_net was accepted with zero rejection. See SECURITY.md.
      - ISOLATION_FOREST_URL=https://isolation-forest:8001
      # Empty by default: X-Forwarded-For is ignored unless the DIRECT peer is
      # listed here. Only add an entry when a real reverse proxy (or the
      # traffic generator, fronted by one) sits in front of the gateway --
      # list that proxy's own IP (e.g. the Docker bridge/host IP), never a
      # permissive/wildcard value.
      # BOTH of this compose project's own bridge gateways, comma-separated:
      # api-gateway sits on both dmz_net (172.18.0.1) and internal_net
      # (172.20.0.1), and on this Docker Desktop/Windows setup the
      # host-published-port traffic (curl, tools/traffic-generator/) is NATed
      # through whichever of the two Docker's userland-proxy happens to pick
      # -- confirmed empirically 2026-07-26 to differ between container
      # restarts even with everything else unchanged, not just across network
      # recreation. Trusting both is a deliberate widening, not an oversight:
      # both IPs are this same compose project's own Docker-managed bridge
      # gateways (never reachable from outside the Docker host), so the
      # security cost is negligible in this dev-only setup, and it removes the
      # flakiness of picking just one. The subnets/gateways for both networks
      # are now pinned via ipam below (not Docker-auto-assigned), so these two
      # specific IPs stay valid across `docker compose down`/rebuilds -- if
      # you ever change those ipam blocks, update this list to match.
      - TRUSTED_PROXIES=172.18.0.1,172.20.0.1
      # The Argus dashboard's origin (services/dashboard, served on 5173) --
      # the ONLY browser origin allowed to call this API with credentials
      # (see CORSMiddleware wiring in app/main.py). Keep this explicit and
      # single-valued; never "*". Comma-separate if a second trusted origin
      # is ever added (e.g. a deployed dashboard URL), but each entry must be
      # a real, specific origin you intend to trust.
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      # Refresh-token cookie attributes (see app/routers/auth.py + CLAUDE.md).
      # These are the DEV values -- localhost:5173 -> localhost:8000 is
      # cross-origin but same-site (SameSite ignores port), so Lax works over
      # plain HTTP with no certificate, and Secure must stay false (no TLS on
      # localhost). PRODUCTION values (dashboard and gateway on two distinct
      # domains -- cross-site): REFRESH_COOKIE_SECURE=true and
      # REFRESH_COOKIE_SAMESITE=none (browsers refuse SameSite=None without
      # Secure, so the two change together). This is a config-only change --
      # never hardcode either value in code.
      - REFRESH_COOKIE_SECURE=false
      - REFRESH_COOKIE_SAMESITE=lax
      # See the volumes entry below: only meaningful for scripts/seed_users.py
      # and scripts/seed_business_data.py, not the running app.
      - SEED_MFA_SECRETS_PATH=/tools/traffic-generator/persona_secrets.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
      isolation-forest:
        condition: service_healthy
    volumes:
      - ../services/api-gateway:/app
      # Write target for scripts/seed_users.py / scripts/seed_business_data.py's
      # persona MFA secrets file -- NOT the app's own code, just an output path
      # so `docker compose run --rm api-gateway poetry run python scripts/seed_...`
      # persists tools/traffic-generator/persona_secrets.json on the HOST
      # instead of inside the ephemeral --rm container (where it would vanish
      # on exit). See SEED_MFA_SECRETS_PATH below.
      - ../tools/traffic-generator:/tools/traffic-generator
      - mtls-certs:/certs:ro
    # --no-proxy-headers: uvicorn's OWN X-Forwarded-For handling is enabled by
    # default and trusts 127.0.0.1 out of the box -- that silently rewrites
    # scope["client"] before our app-level resolve_client_ip (TRUSTED_PROXIES
    # allowlist) ever sees the request, making our allowlist meaningless
    # whenever a caller's connection happens to appear as 127.0.0.1 (e.g. some
    # Docker port-publishing paths). Disabling it here makes resolve_client_ip
    # the single source of truth for the real peer.
    command: sh -c "poetry run alembic upgrade head && poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --no-proxy-headers"
    networks:
      - dmz_net
      - internal_net

  isolation-forest:
    build:
      context: ../services/isolation-forest
      dockerfile: Dockerfile
    container_name: isolation-forest
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      REDIS_URL: redis://:redis-dev-password@redis:6379/0
      # REDIS_URL is read-only here: the Gateway still builds the complete
      # feature_vector itself (Redis-derived counters included) before calling
      # /score, so Isolation Forest never touches feature keys. The only thing
      # it reads from Redis is model:active_version, polled every 30s to know
      # which trained model file to hot-swap in — it still never writes to
      # Redis or Postgres.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    volumes:
      - models-volume:/models
      # mTLS Gateway<->Isolation Forest (see SECURITY.md): the server
      # cert/key issued to this service by vault-init.sh's
      # isolation-forest-server PKI role, the shared internal CA (to verify
      # the Gateway's client cert), and -- for the healthcheck below only --
      # the Gateway's OWN client cert/key, reused rather than fabricating a
      # separate "self" identity (same principle already applied to
      # opa-server vs gateway-client: a server cert and a client cert have
      # different X.509 extended key usages, so this healthcheck presents
      # itself using the identity that's ACTUALLY meant to have access here).
      - mtls-certs:/certs:ro
    # --ssl-cert-reqs 2 = ssl.CERT_REQUIRED: requires and verifies a client
    # certificate signed by --ssl-ca-certs, which is what makes this mutual,
    # not just encrypted -- mirrors OPA's --authentication=tls below. Known,
    # documented gap versus OPA's setup: uvicorn 0.30.x has no CLI-level
    # "--min-tls-version" equivalent to OPA's --min-tls-version 1.3, so the
    # negotiated floor here relies on OpenSSL/Python's own defaults rather
    # than an explicit pin on the SERVER side. In practice this is not a
    # real downgrade for legitimate Gateway traffic: the Gateway's own
    # client-side SSLContext (core/tls.py) sets minimum_version = TLSv1_3
    # and simply won't offer anything lower, so real Gateway<->Isolation
    # Forest traffic still negotiates TLS 1.3 -- the gap is that a
    # DIFFERENT, non-Gateway TLS 1.2 client isn't rejected by the server
    # itself the way OPA would reject one. Documented rather than silently
    # left implicit.
    command: >
      poetry run uvicorn app.main:app --host 0.0.0.0 --port 8001
      --ssl-keyfile /certs/isolation-forest-server-key.pem
      --ssl-certfile /certs/isolation-forest-server.pem
      --ssl-ca-certs /certs/ca.pem
      --ssl-cert-reqs 2
    healthcheck:
      # Plain urllib.request.urlopen (the old check) would fail the mTLS
      # handshake outright now (no client cert offered) -- this builds an
      # SSLContext presenting the Gateway's own client cert, exercising the
      # actual trust boundary a real caller has to clear, not a weakened
      # loopback-only shortcut. Connects to the container's own DNS alias
      # (not "localhost") because the server cert's SAN is "isolation-forest"
      # -- check_hostname (on by default for PROTOCOL_TLS_CLIENT) would
      # otherwise reject "localhost" as a hostname mismatch.
      test:
        - "CMD-SHELL"
        - >-
          python -c "import ssl, urllib.request;
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT);
          ctx.load_verify_locations(cafile='/certs/ca.pem');
          ctx.load_cert_chain(certfile='/certs/gateway-client.pem', keyfile='/certs/gateway-client-key.pem');
          urllib.request.urlopen('https://isolation-forest:8001/health', context=ctx)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      # internal_net only: api-gateway is already a member of internal_net (see its own
      # networks block), so that alone is sufficient for Gateway -> Isolation Forest
      # reachability. dmz_net was previously added here on the basis of an architecture
      # diagram reference (archit_finale.pdf), not a technical need -- removed after a
      # live audit confirmed scoring continues to work correctly via internal_net alone
      # (see SECURITY.md). Mirrors the reasoning already applied to exclude
      # canary-validator from dmz_net: a component only ever called BY the Gateway over
      # a private network has no business on the more broadly-reachable segment.
      - internal_net

  canary-validator:
    build:
      context: ../services/canary-validator
      dockerfile: Dockerfile
    container_name: canary-validator
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      CANARY_BATCH_SIZE: "15000"
      REDIS_URL: redis://:redis-dev-password@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models-volume:/models
    networks:
      # A one-shot batch job that only talks to Postgres/Redis/the shared volume
      # has no business on the DMZ -- unlike isolation-forest (called live by the
      # Gateway on the request path), canary-validator is invoked out-of-band by
      # `docker compose run --rm canary-validator` and never serves traffic.
      - internal_net
    # One-shot job (same pattern as ml-trainer): `profiles: ["jobs"]` keeps it out
    # of a plain `docker compose up`; no port, no healthcheck, no restart policy --
    # it runs to completion and exits 0.

  ml-trainer:
    build:
      context: ../services/ml-trainer
      dockerfile: Dockerfile
    container_name: ml-trainer
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      REDIS_URL: redis://:redis-dev-password@redis:6379/0
      TRAINING_WINDOW_DAYS: 30
      # reader1@zt.local is this project's own live-verification/demo
      # account (see live_verify_*.py / DEMO_GUIDE.md), reused across dozens
      # of sessions -- not one legitimate user's traffic. Confirmed live: it
      # alone produced resource_access (feature_vector[7]) values up to 386;
      # every other account tops out at 25, matching the empirical threshold
      # CLAUDE.md's Behavioral detector section documents. Excluded from
      # training so the model's notion of "normal" isn't calibrated against
      # this project's own test harness. See TrainerSettings.training_excluded_emails.
      # reader14@zt.local: privilege-escalation attack actor (scenario D,
      # seed 42) -- its rbac_deny attempts never write samples (ALLOW-only
      # gating), but its few concurrent legitimate reads carry a contaminated
      # feature_vector[12] (deny_count 29-34, shared per-user Redis counter
      # bleeding the attack's footprint into neighbouring legitimate requests).
      # Excluded by identity since the contamination is on a dimension the
      # behavioral filter (TRAINING_MAX_RESOURCE_ACCESS, feature_vector[7])
      # doesn't inspect.
      TRAINING_EXCLUDED_EMAILS: reader1@zt.local,reader14@zt.local
      # Excludes samples by BEHAVIOR (feature_vector[7], distinct raw
      # resources over 5 min) rather than identity -- complements
      # TRAINING_EXCLUDED_EMAILS above, doesn't replace it. Live-verified:
      # real normal traffic (reader1/reader8 set aside) tops out at 11;
      # reader8@zt.local's scenario-A enumeration burst produced 178 samples
      # at 31-207 in a single 2m20s window. 30 leaves ~2.7x headroom above
      # the observed normal ceiling. See TrainerSettings.training_max_resource_access.
      TRAINING_MAX_RESOURCE_ACCESS: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models-volume:/models
    networks:
      - internal_net
    # Déclenché sur planification hebdomadaire (scheduler externe ou cron interne
    # au conteneur) — pas de port exposé, aucun appel client direct. One-shot job:
    # `profiles: ["jobs"]` keeps it out of a plain `docker compose up` — invoke
    # explicitly with `docker compose run --rm ml-trainer` (or the same command
    # from an external weekly scheduler). No healthcheck: a container that exits
    # 0 on success has no "running" state for a healthcheck to observe.

  behavioral-detector:
    build:
      context: ../services/behavioral-detector
      dockerfile: Dockerfile
    container_name: behavioral-detector
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      REDIS_URL: redis://:redis-dev-password@redis:6379
      SCAN_INTERVAL_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Reads HEARTBEAT_FILE/SCAN_INTERVAL_SECONDS from THIS SAME service's own
    # environment (not hardcoded separately) so the check can never drift
    # from what DetectorSettings actually resolves. Same "3x the interval"
    # staleness multiplier as isolation-forest's /health heartbeat check.
    # This mechanism (settings.py's heartbeat_file, touched every loop
    # iteration by _touch_heartbeat regardless of scan success/failure) has
    # existed since this service was built, but nothing ever wired a
    # healthcheck to read it -- Docker reported this container "healthy" as
    # long as the process was merely running, even if the scan loop itself
    # had hung. Same category of gap already fixed on isolation-forest.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, sys, time; p = os.environ.get('HEARTBEAT_FILE', '/tmp/behavioral-detector-heartbeat'); i = int(os.environ.get('SCAN_INTERVAL_SECONDS', '60')); sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < i * 3 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Must exceed one full SCAN_INTERVAL_SECONDS (60s default) so the
      # container isn't marked unhealthy before the very first scan tick has
      # had a chance to touch the heartbeat file at all.
      start_period: 90s
    networks:
      - internal_net
    # Job asynchrone à fenêtre glissante : lit events/opa_decision_log + Redis,
    # écrit dans event_anomaly (anomaly_type = 'behavioral'). Jamais exposé
    # au trafic client — reste en internal_net uniquement.

  dashboard:
    build:
      context: ../services/dashboard
      dockerfile: Dockerfile.dev
    container_name: argus-dashboard
    ports:
      - "5173:5173"
    volumes:
      - ../services/dashboard:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ../services/dashboard
          target: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Resolved by the BROWSER, not this container -- the dashboard is a
      # client-side SPA that talks only to the Gateway's published port, per
      # the "never touches the internal network directly" architecture rule.
      # That's also why this service sits on monitoring_net only (see
      # networks: below) and NOT dmz_net/internal_net: it doesn't need
      # container-to-container reachability to the Gateway, only to serve
      # its own JS bundle to the host browser.
      - VITE_GATEWAY_URL=http://localhost:8000
    networks:
      - monitoring_net
    depends_on:
      - api-gateway

networks:
  # Subnets/gateways pinned explicitly (rather than left to Docker's
  # auto-assignment) so TRUSTED_PROXIES above stays valid across rebuilds --
  # an auto-assigned bridge can get a different subnet each time the network
  # is recreated, silently invalidating any hardcoded trusted-proxy IP.
  internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
  monitoring_net:
    driver: bridge  # réseau virtuel isolé sur la machine hôte
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  models-volume:
    driver: local  # partagé entre isolation-forest, canary-validator, ml-trainer
  mtls-certs:
    driver: local  # CA + certs mTLS Gateway<->OPA, écrits une fois par vault-init.sh