services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: zt_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - internal_net

  vault:
    image: hashicorp/vault:1.20.2
    container_name: vault
    command: server -dev -dev-root-token-id=dev-root-token -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.20.2
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./vault-init.sh:/vault-init.sh:ro
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    networks:
      - internal_net
    # This container runs once and exits 0 - it is not a long-running service.

  opa:
    image: openpolicyagent/opa:1.18.1
    container_name: opa
    restart: unless-stopped
    command: >
      run
      --server
      --addr http://0.0.0.0:8181
      /policy
    volumes:
      - ../policies:/policy:ro
    networks:
      - internal_net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Corrigé : le protocole doit correspondre à --addr http:// ci-dessus,
      # sinon le healthcheck échoue systématiquement même si OPA fonctionne.
      test: ["CMD", "opa", "eval", "--fail", "1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: zt-api
    ports:
      - "8000:8000"
    env_file:
      - ../services/api-gateway/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@postgres:5432/zt_db
      - REDIS_URL=redis://redis:6379
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
      - OPA_URL=http://opa:8181
      - ISOLATION_FOREST_URL=http://isolation-forest:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
      isolation-forest:
        condition: service_healthy
    volumes:
      - ../services/api-gateway:/app
    command: sh -c "poetry run alembic upgrade head && poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    networks:
      - dmz_net
      - internal_net

  isolation-forest:
    build:
      context: ../services/isolation-forest
      dockerfile: Dockerfile
    container_name: isolation-forest
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      REDIS_URL: redis://redis:6379/0
      # REDIS_URL is read-only here: the Gateway still builds the complete
      # feature_vector itself (Redis-derived counters included) before calling
      # /score, so Isolation Forest never touches feature keys. The only thing
      # it reads from Redis is model:active_version, polled every 30s to know
      # which trained model file to hot-swap in — it still never writes to
      # Redis or Postgres.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models-volume:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      # Corrigé : ajout de dmz_net — Isolation Forest fait partie du pipeline ML
      # rattaché au Gateway dans archit_finale.pdf, pas seulement de la zone internal.
      - internal_net
      - dmz_net

  canary-validator:
    build:
      context: ../services/canary-validator
      dockerfile: Dockerfile
    container_name: canary-validator
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models-volume:/models
    networks:
      # A one-shot batch job that only talks to Postgres/Redis/the shared volume
      # has no business on the DMZ -- unlike isolation-forest (called live by the
      # Gateway on the request path), canary-validator is invoked out-of-band by
      # `docker compose run --rm canary-validator` and never serves traffic.
      - internal_net
    # One-shot job (same pattern as ml-trainer): `profiles: ["jobs"]` keeps it out
    # of a plain `docker compose up`; no port, no healthcheck, no restart policy --
    # it runs to completion and exits 0.

  ml-trainer:
    build:
      context: ../services/ml-trainer
      dockerfile: Dockerfile
    container_name: ml-trainer
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      REDIS_URL: redis://redis:6379/0
      TRAINING_WINDOW_DAYS: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models-volume:/models
    networks:
      - internal_net
    # Déclenché sur planification hebdomadaire (scheduler externe ou cron interne
    # au conteneur) — pas de port exposé, aucun appel client direct. One-shot job:
    # `profiles: ["jobs"]` keeps it out of a plain `docker compose up` — invoke
    # explicitly with `docker compose run --rm ml-trainer` (or the same command
    # from an external weekly scheduler). No healthcheck: a container that exits
    # 0 on success has no "running" state for a healthcheck to observe.

  behavioral-detector:
    build:
      context: ../services/behavioral-detector
      dockerfile: Dockerfile
    container_name: behavioral-detector
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      REDIS_URL: redis://redis:6379
      SCAN_INTERVAL_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_net
    # Job asynchrone à fenêtre glissante : lit events/opa_decision_log + Redis,
    # écrit dans event_anomaly (anomaly_type = 'behavioral'). Jamais exposé
    # au trafic client — reste en internal_net uniquement.

  react-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - monitoring_net
      - dmz_net
    depends_on:
      - api-gateway

networks:
  internal_net:
    driver: bridge
  dmz_net:
    driver: bridge
  monitoring_net:
    driver: bridge  # réseau virtuel isolé sur la machine hôte

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  models-volume:
    driver: local  # partagé entre isolation-forest, canary-validator, ml-trainer