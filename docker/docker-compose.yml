services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: zt_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - internal_net

  vault:
    image: hashicorp/vault:1.20.2
    container_name: vault
    command: server -dev -dev-root-token-id=dev-root-token -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.20.2
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./vault-init.sh:/vault-init.sh:ro
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    networks:
      - internal_net
    # This container runs once and exits 0 - it is not a long-running service.

  opa:
    image: openpolicyagent/opa:1.18.1
    container_name: opa
    restart: unless-stopped
    command: >
      run
      --server
      --addr http://0.0.0.0:8181
      /policy
    volumes:
      - ../policies:/policy:ro
    networks:
      - internal_net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Corrigé : le protocole doit correspondre à --addr http:// ci-dessus,
      # sinon le healthcheck échoue systématiquement même si OPA fonctionne.
      test: ["CMD", "opa", "eval", "--fail", "1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: zt-api
    ports:
      - "8000:8000"
    env_file:
      - ../services/api-gateway/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@postgres:5432/zt_db
      - REDIS_URL=redis://redis:6379
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
      - OPA_URL=http://opa:8181
      - ISOLATION_FOREST_URL=http://isolation-forest:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
      #isolation-forest:
        #condition: service_healthy
    volumes:
      - ../services/api-gateway:/app
    command: sh -c "poetry run alembic upgrade head && poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    networks:
      - dmz_net
      - internal_net

  isolation-forest:
    build:
      context: ../services/isolation-forest
      dockerfile: Dockerfile
    container_name: isolation-forest
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      # Pas de REDIS_URL ici : le Gateway construit déjà le feature_vector complet
      # (lectures Redis incluses) avant l'appel — Isolation Forest ne reçoit
      # qu'un vecteur de nombres en entrée et n'écrit que dans PostgreSQL.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models-volume:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      # Corrigé : ajout de dmz_net — Isolation Forest fait partie du pipeline ML
      # rattaché au Gateway dans archit_finale.pdf, pas seulement de la zone internal.
      - internal_net
      - dmz_net

  canary-validator:
    build:
      context: ../services/canary-validator
      dockerfile: Dockerfile
    container_name: canary-validator
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models-volume:/models
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      # Corrigé : ajout de dmz_net, même raison qu'isolation-forest.
      - internal_net
      - dmz_net

  ml-trainer:
    build:
      context: ../services/ml-trainer
      dockerfile: Dockerfile
    container_name: ml-trainer
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      TRAINING_WINDOW_DAYS: 30
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models-volume:/models
    networks:
      - internal_net
    # Déclenché sur planification hebdomadaire (scheduler externe ou cron interne
    # au conteneur) — pas de port exposé, aucun appel client direct.

  behavioral-detector:
    build:
      context: ../services/behavioral-detector
      dockerfile: Dockerfile
    container_name: behavioral-detector
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/zt_db
      REDIS_URL: redis://redis:6379
      SCAN_INTERVAL_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_net
    # Job asynchrone à fenêtre glissante : lit events/opa_decision_log + Redis,
    # écrit dans event_anomaly (anomaly_type = 'behavioral'). Jamais exposé
    # au trafic client — reste en internal_net uniquement.

  react-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - monitoring_net
      - dmz_net
    depends_on:
      - api-gateway

networks:
  internal_net:
    driver: bridge
  dmz_net:
    driver: bridge
  monitoring_net:
    driver: bridge  # réseau virtuel isolé sur la machine hôte

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  models-volume:
    driver: local  # partagé entre isolation-forest, canary-validator, ml-trainer