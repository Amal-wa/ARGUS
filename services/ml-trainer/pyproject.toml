[tool.poetry]
name = "ml-trainer"
version = "0.1.0"
description = "Zero Trust ML training job for Isolation Forest anomaly models"
authors = ["Amel Ben Khalifa <amel.benkhalifa@supcom.tn>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
scikit-learn = "^1.5.0"
joblib = "^1.4.0"
numpy = "^1.26.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
