[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "Zero Trust API Gateway"
authors = ["Amel Ben Khalifa <amel.benkhalifa@supcom.tn>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
alembic = "^1.13.0"
cryptography = "^45.0.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
redis = "^5.0.0"
asyncpg = "^0.29.0"
argon2-cffi = "^23.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

